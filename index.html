<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚠️ تنبيه أمني خطير - باندا الهاكر</title>

    <!-- وسوم المعاينة الخارجية -->
    <meta property="og:title" content="10 تم اختراقك من طرف PANDAAA" />
    <meta property="og:description" content="تم تجميد النظام وسحب الكاميرا والبيانات! أدخل الكود فوراً لإنقاذ هاتفك." />
    <meta property="og:image" content="hacked.jpg" />
    <meta property="og:type" content="website" />
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="10 سؤالة كان تجاوب عليهم راك تعرفني">
    <meta name="twitter:description" content="تم تجميد النظام وسحب الكاميرا والبيانات! أدخل الكود فوراً لإنقاذ هاتفك.">
    <meta name="twitter:image" content="hacked.jpg">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.2s ease;
        }
        body.error-flash {
            animation: flashBg 0.3s ease 3;
        }
        @keyframes flashBg {
            0% { background-color: #000; }
            50% { background-color: #550000; }
            100% { background-color: #000; }
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }
        .hack-table {
            border: 2px solid #ff0000;
            background-color: rgba(10, 5, 5, 0.96);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.9);
            z-index: 10;
            max-width: 90%;
            width: 340px;
            transition: transform 0.1s ease;
        }
        .shake {
            animation: shakeBox 0.4s ease;
        }
        @keyframes shakeBox {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-10px, 5px); }
            40% { transform: translate(10px, -5px); }
            60% { transform: translate(-10px, -5px); }
            80% { transform: translate(10px, 5px); }
            100% { transform: translate(0, 0); }
        }

        .panda-hacker-large {
            width: 100%;
            max-height: 180px;
            border-radius: 8px;
            border: 2px solid #ff0000;
            object-fit: cover;
            margin-bottom: 10px;
            box-shadow: 0 0 20px #ff0000;
            animation: pulsePanda 1.5s infinite alternate;
        }
        @keyframes pulsePanda {
            0% { box-shadow: 0 0 10px #ff0000; }
            100% { box-shadow: 0 0 25px #ff0000, inset 0 0 15px #ff0000; }
        }

        h1 {
            font-size: 18px;
            margin-bottom: 8px;
            text-shadow: 0 0 12px #ff0000;
        }
        p {
            color: #00ff00;
            text-shadow: 0 0 6px #00ff00;
            font-size: 12px;
            margin: 5px 0;
        }
        #warningText {
            color: #ff3333;
            font-weight: bold;
            text-shadow: 0 0 8px #ff0000;
            min-height: 20px;
            margin-bottom: 8px;
            font-size: 11px;
        }
        input {
            padding: 9px;
            font-size: 15px;
            background-color: #111;
            border: 1px solid #ff0000;
            color: #fff;
            text-align: center;
            border-radius: 5px;
            outline: none;
            width: 85%;
            margin-top: 5px;
        }
        button {
            padding: 9px 20px;
            margin-top: 12px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255,0,0,0.5);
        }
        button:hover {
            background-color: #cc0000;
        }
        /* تصميم زر الخروج النهائي */
        .exit-btn {
            background-color: #00ff00;
            color: #000;
            box-shadow: 0 0 15px #00ff00;
        }
        .exit-btn:hover {
            background-color: #00cc00;
        }
    </style>
</head>
<body onclick="initExperience()">

    <canvas id="matrix"></canvas>

    <table class="hack-table" id="prankContainer">
        <tr>
            <td>
                <img src="hacked.jpg" alt="Panda Hacker" class="panda-hacker-large">
                <h1>تم اختراقك من قبل PANDAAAAA </h1>
                <p>تم سحب الملفات، الكاميرا، وكلمات المرور بنجاح!</p>
                <div id="warningText">أنقر في أي مكان لتفعيل طوق النجاة...</div>
                <input type="password" id="secCode" placeholder="أدخل كود الفك السري...">
                <br>
                <button onclick="unlockPhone()">إلغاء القفل وطرد الهاكر</button>
            </td>
        </tr>
    </table>

    <script>
        let audioCtx = null;
        let isStarted = false;

        function initExperience() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
            }
            if (!isStarted) {
                isStarted = true;
                document.getElementById("warningText").innerText = "⚠️ النظام مجمد بالكامل! أدخل الكود السري:";
                startScaryAudio();
            }
        }

        function startScaryAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(60, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
            } catch(e) {}
        }

        function playErrorSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch(e) {}
        }

        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;

        const chars = "01010101PANDAHACKERSYSTEMWARNINGDELETED";
        const alphabet = chars.split("");
        const font_size = 14;
        const columns = canvas.width / font_size;
        const drops = [];
        for (let x = 0; x < columns; x++) { drops[x] = 1; }

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff0000";
            ctx.font = font_size + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                ctx.fillText(text, i * font_size, drops[i] * font_size);
                if (drops[i] * font_size > canvas.height && Math.random() > 0.975) { drops[i] = 0; }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 25);

        function unlockPhone() {
            var inputVal = document.getElementById("secCode").value;
            if (inputVal === "hama") {
                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(err => {});
                }
                // تغيير محتوى الصندوق لإظهار رسالة النجاح مع زر الخروج النهائي
                document.getElementById("prankContainer").innerHTML = `
                    <h1 style='color: #00ff00; text-shadow: 0 0 20px #00ff00;'>🐼😂 كفو! تم طرد باندا الهاكر ونجح المقلب بامتياز!</h1>
                    <p style='color: #fff;'>اضغط على الزر أدناه للخروج النهائي وإغلاق الصفحة:</p>
                    <button class="exit-btn" onclick="exitSite()">🚪 خروج نهائي من المتصفح</button>
                `;
                setTimeout(() => {
                    document.body.style.backgroundColor = "#ffffff";
                    canvas.style.display = "none";
                }, 2000);
            } else {
                playErrorSound();
                if (navigator.vibrate) {
                    navigator.vibrate([600, 200, 600, 200, 600]);
                }
                let container = document.getElementById("prankContainer");
                container.classList.add("shake");
                document.body.classList.add("error-flash");

                setTimeout(() => {
                    container.classList.remove("shake");
                    document.body.classList.remove("error-flash");
                }, 600);

                document.getElementById("warningText").innerText = "❌ كود خاطئ! تحذير: بدأ العد التنازلي لحذف الصور!";
            }
        }

        // دالة الخروج النهائي والإغلاق
        function exitSite() {
            try {
                window.close(); // محاولة إغلاق النافذة
            } catch(e) {}
            // إذا منع المتصفح الإغلاق المباشر، يتم نقله لصفحة فارغة أو جوجل لإنهاء الموقع تماماً
            window.location.href = "about:blank";
        }
    </script>

</body>
</html>
